[project]
name = "mcplint"
version = "0.1.0"
description = "A tiny, dependency-free static linter for MCP server tool definitions"
readme = "README.md"
authors = [
    { name = "node-and-edge", email = "nodeandedge@gmail.com" },
    { name = "JaiSuryaPrabu", email = "jaisurya@nodeandedges.com" },
    { name = "UditSharma", email = "uditsharma9981@gmail.com" },
]
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "linter",
    "static-analysis",
    "prompt-injection",
    "tool-poisoning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/node-and-edge/mcplint"
Repository = "https://github.com/node-and-edge/mcplint"
Changelog = "https://github.com/node-and-edge/mcplint/blob/main/CHANGELOG.md"
Issues = "https://github.com/node-and-edge/mcplint/issues"

[project.scripts]
mcplint = "mcplint.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
