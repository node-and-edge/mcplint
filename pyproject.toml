[project]
name = "mcplint"
version = "0.1.0"
description = "A tiny, dependency-free static linter for MCP server tool definitions"
readme = "README.md"
authors = [
    { name = "node-and-edge", email = "nodeandedge@gmail.com" },
    { name = "JaiSuryaPrabu", email = "jaisurya@nodeandedges.com" },
    { name = "UditSharma", email = "uditsharma9981@gmail.com" },
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcplint = "mcplint.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
